<!DOCTYPE html>
<html lang="en" dir="auto">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منقذ — Monqez</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #c0392b 0%, #8B0000 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
    }

    .card {
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 48px 36px;
      max-width: 380px;
      width: 90%;
      text-align: center;
    }

    .icon {
      font-size: 64px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 16px;
      opacity: 0.85;
      margin-bottom: 8px;
    }

    .arabic {
      font-size: 18px;
      opacity: 0.9;
      margin-bottom: 32px;
      direction: rtl;
    }

    .divider {
      border: none;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      margin: 24px 0;
    }

    .message {
      font-size: 15px;
      opacity: 0.85;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 12px;
      transition: opacity 0.2s;
    }

    .btn:active {
      opacity: 0.8;
    }

    .btn-android {
      background: white;
      color: #c0392b;
    }

    .btn-ios {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .footer {
      margin-top: 24px;
      font-size: 13px;
      opacity: 0.6;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="icon">🩸</div>
    <h1>Monqez — منقذ</h1>
    <p class="subtitle">Blood Donation App</p>
    <p class="arabic">تطبيق التبرع بالدم</p>

    <hr class="divider" />

    <p class="message">
      A friend shared a daily health tip with you.<br />
      Download the Monqez app to read it and start your donation journey!
    </p>
    <p class="message" dir="rtl">
      شارك معك صديق نصيحة صحية يومية.<br />
      حمّل تطبيق منقذ لتقرأها وتبدأ رحلتك في التبرع!
    </p>

    <a class="btn btn-android" href="https://play.google.com/store/apps/details?id=com.example.monqez" target="_blank">
      📱 Download on Google Play
    </a>
    <a class="btn btn-ios" href="https://apps.apple.com/app/monqez" target="_blank">
      Download on App Store
    </a>

  </div>
</body>

</html>
